services:

  postgres:
    image: postgres:latest

    container_name: postgres_smartsalud

    environment:
      POSTGRES_DB: smartsalud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin

    ports:
      - "5433:5432"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_smartsalud
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_smartsalud
    ports:
      - "3001:3000"
    depends_on:
      - prometheus